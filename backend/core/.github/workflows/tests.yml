name: Core tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/ci-constraints.txt
      - name: Install package and check dependencies
        run: |
          python -m pip install --constraint .github/ci-constraints.txt . requests
          python -m pip check
      - name: Run offline regression tests
        run: python -m tests.run

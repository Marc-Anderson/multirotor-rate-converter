services:
  rateapi:
    cap_drop:
      - ALL
    build:
      # args:
        # define the user id for gunicorn in the container
      # define the root directory for the dockerfiles context
      context: ./backend
      dockerfile: Dockerfile.backend
    # environment:
    #   # define environment variables for the container
    ports:
      # host side configurable for direct/local debugging access to the api, bypassing caddy
      # container side fixed at 3001 to match gunicorn's bind port and the Caddyfile's reverse_proxy target
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"
    # volumes:
    #   -
    security_opt:
      - "no-new-privileges"
    restart: unless-stopped
    logging:
      # force docker to rotate logs
      driver: json-file
      options:
        max-size: 10m
        max-file: 5
        tag: "{{.ImageName}}/{{.Name}}/{{.ID}}"

  caddy:
    cap_drop:
      - ALL
    cap_add:
      # required to bind ports 80/443
      - NET_BIND_SERVICE
    build:
      # args:
      #   - 
      # define the root directory for the dockerfiles context
      context: ./frontend
      dockerfile: Dockerfile.frontend
    environment:
      # define environment variables for the container
      - DOC_DOMAIN=${DOC_DOMAIN:-http://localhost}
      - SSL_EMAIL=${SSL_EMAIL:-webmaster@example.com}
    ports:
      # should be 3000:80 for dev and 80:80, 443:443 for prod
      - "${HTTP_PORT:-3000}:80"
      - "443:443"
    depends_on:
      - rateapi
    volumes:
      # caddy-managed certs/state, no host permissions needed
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - "no-new-privileges"
    restart: unless-stopped
    logging:
      # force docker to rotate logs
      driver: json-file
      options:
        max-size: 10m
        max-file: 5
        tag: "{{.ImageName}}/{{.Name}}/{{.ID}}"

volumes:
  caddy_data:
  caddy_config:

# copy `.env.example` to `.env` and edit DOC_DOMAIN, SSL_EMAIL, and HTTP_PORT=80 for production
# docker-compose config
# docker compose up --env-file ./.env.example --build
# docker compose up --env-file ./.env.example -d --build
# docker compose down --env-file ./.env.example

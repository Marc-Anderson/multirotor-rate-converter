name: Backend tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and check dependencies
        run: |
          python -m pip install -r requirements.txt requests
          python -m pip check
      - name: Run core regression tests
        working-directory: backend/core
        run: python -m tests.run
      - name: Test HTTP API
        run: python -m unittest discover -s ../tests -p 'test_backend.py' -v
